apiVersion: v1alpha1
kind: Setting
metadata:
  name: halo-ai-console-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: select
          name: defaultLanguageModelMode
          label: 默认语言模型
          value: default
          help: 选择“默认”时使用 AI Foundation 中对应能力的默认模型；选择“指定模型名”时填写下方模型 name。
          options:
            - label: 默认
              value: default
            - label: 指定模型名
              value: custom
        - $formkit: text
          name: defaultLanguageModel
          label: 指定语言模型 name
          help: 仅在上方选择“指定模型名”时生效，必须是 AI Foundation 模型 name。
          value: ""
        - $formkit: select
          name: defaultMultimodalModelMode
          label: 默认多模态模型
          value: default
          help: 选择“默认”时使用 AI Foundation 中支持图片输入的默认模型；选择“指定模型名”时填写下方模型 name。
          options:
            - label: 默认
              value: default
            - label: 指定模型名
              value: custom
        - $formkit: text
          name: defaultMultimodalModel
          label: 指定多模态模型 name
          help: 仅在上方选择“指定模型名”时生效，必须是支持图片输入的语言模型 name。
          value: ""
        - $formkit: select
          name: defaultImageModelMode
          label: 默认图像生成模型
          value: default
          help: 选择“默认”时使用 AI Foundation 中图像生成能力的默认模型；选择“指定模型名”时填写下方模型 name。
          options:
            - label: 默认
              value: default
            - label: 指定模型名
              value: custom
        - $formkit: text
          name: defaultImageModel
          label: 指定图像生成模型 name
          help: 仅在上方选择“指定模型名”时生效，必须是图像生成模型 name。
          value: ""
        - $formkit: textarea
          name: allowedModels
          label: 允许用户使用的模型列表
          help: 每行或用英文逗号填写一个 AI Foundation 模型 name。留空表示允许所有已启用模型。
          value: ""
        - $formkit: number
          name: imageMaxSizeMb
          label: 单张图片大小上限（MB）
          value: 8
          min: 1
          max: 50
        - $formkit: number
          name: maxConcurrentJobs
          label: 最大并发任务数
          value: 2
          min: 1
          max: 20
        - $formkit: number
          name: requestsPerMinute
          label: 每分钟请求数
          value: 12
          min: 1
          max: 300
        - $formkit: number
          name: dailyTokenLimit
          label: 每日最大 token 消耗
          value: 200000
          min: 1000
          max: 10000000
        - $formkit: number
          name: maxContextMessages
          label: 发送给 AI 的最大消息数
          value: 30
          min: 4
          max: 100
        - $formkit: number
          name: maxContextCharacters
          label: 发送给 AI 的最大字符数
          value: 80000
          min: 4000
          max: 200000
        - $formkit: number
          name: maxOutputCharacters
          label: 单次回复最大字符数
          help: 按思考过程与最终回复的合计字符数计算。
          value: 200000
          min: 4000
          max: 200000
        - $formkit: number
          name: maxImagesPerRequest
          label: 单次请求最大图片数
          value: 12
          min: 0
          max: 50
        - $formkit: number
          name: jobRetentionDays
          label: Job 保留天数
          value: 7
          min: 1
          max: 365
        - $formkit: number
          name: logRetentionDays
          label: 日志保留天数
          value: 90
          min: 7
          max: 3650
        - $formkit: number
          name: imageCacheRetentionDays
          label: 图片缓存保留天数
          help: 到期后清理插件保存的图片缓存元数据和受限制的 data URL，不删除 Halo 附件库中的原始附件。
          value: 30
          min: 1
          max: 3650
        - $formkit: radio
          name: allowUserAuditLogDeletion
          label: 允许用户在删除个人数据时删除自己的审计日志
          help: 关闭时，DELETE /me/data 会保留该用户的审计日志；管理员始终可以按权限查看全部日志。
          value: false
          options:
            - label: 不允许
              value: false
            - label: 允许
              value: true
        - $formkit: number
          name: maxJobsPerUser
          label: 每用户最多保留 Job 数
          value: 500
          min: 50
          max: 10000
