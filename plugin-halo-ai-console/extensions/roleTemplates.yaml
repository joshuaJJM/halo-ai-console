apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-halo-ai-console-view-and-manage-own
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "Halo AI Console"
    rbac.authorization.halo.run/display-name: "使用和管理自己的 AI 对话"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:halo-ai-console:view","plugin:halo-ai-console:manage-own"]
rules:
  - apiGroups: ["console.api.aifoundation.halo.run"]
    resources: ["model-options", "models", "models/*"]
    verbs: ["get", "list"]
  - apiGroups: ["console.api.halo-ai-console.halo.run"]
    resources:
      ["sessions-with-messages", "sessions", "sessions/snapshot", "call-logs", "audit-logs", "settings",
       "assets", "image-caches", "jobs", "jobs/events", "jobs/cancel", "me",
       "models/generate-text"]
    verbs: ["get", "list", "create", "update", "delete"]
  # Halo treats collection POSTs with a name but no subresource as non-resource URLs.
  - nonResourceURLs:
      - "/apis/console.api.halo-ai-console.halo.run/v1alpha1/attachments/upload"
      - "/apis/console.api.halo-ai-console.halo.run/v1alpha1/jobs/chat"
      - "/apis/console.api.halo-ai-console.halo.run/v1alpha1/jobs/image"
      - "/apis/console.api.halo-ai-console.halo.run/v1alpha1/models/*/generate-text"
    verbs: ["create"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-halo-ai-console-audit
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: |
      ["role-template-halo-ai-console-view-and-manage-own"]
    rbac.authorization.halo.run/module: "Halo AI Console"
    rbac.authorization.halo.run/display-name: "查看自己的 AI 审计日志"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:halo-ai-console:audit"]
rules:
  - apiGroups: ["console.api.halo-ai-console.halo.run"]
    resources: ["audit-logs"]
    verbs: ["get", "list"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-halo-ai-console-admin
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/dependencies: |
      ["role-template-halo-ai-console-view-and-manage-own"]
    rbac.authorization.halo.run/module: "Halo AI Console"
    rbac.authorization.halo.run/display-name: "管理 Halo AI Console"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:halo-ai-console:admin","plugin:halo-ai-console:call-log-all"]
rules:
  - apiGroups: ["console.api.halo-ai-console.halo.run"]
    resources:
      ["call-logs", "audit-logs", "migration/status", "global-settings"]
    verbs: ["get", "list", "create", "update", "delete"]
  - nonResourceURLs:
      - "/apis/console.api.halo-ai-console.halo.run/v1alpha1/migration/legacy"
    verbs: ["create"]
