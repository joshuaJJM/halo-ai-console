name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin-halo-ai-console/ui/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test from a clean checkout
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Verify packaged metadata and frontend entry
        run: |
          version="$(./gradlew -q properties --property version | awk '/^version:/ { print $2 }')"
          artifact="build/libs/halo-ai-console-${version}.jar"
          test -f "$artifact"
          unzip -p "$artifact" plugin.yaml | grep "version: \"${version}\""
          unzip -l "$artifact" | grep 'ui/main.js'
